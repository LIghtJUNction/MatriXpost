[workspace]
members = [
    "crates/matrixpost-core",
    "crates/matrixpost-cli",
    "crates/matrixpostd",
    "crates/matrixpost-mcp",
    "crates/matrixpost-desktop",
    "crates/matrixpost-webdriver-runner",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "GPL-2.0-only"
repository = "https://github.com/lightjunction/MatriXpost"
homepage = "https://github.com/lightjunction/MatriXpost"
rust-version = "1.85"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = { version = "2", features = ["serde"] }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
rusqlite = { version = "0.32", features = ["bundled"] }
toml = "0.8"
ureq = "2.10"
tower = { version = "0.5", features = ["util"] }
rand = "0.9"
rmcp = { version = "=2.2.0", default-features = false, features = ["client", "server", "macros", "transport-io"] }
