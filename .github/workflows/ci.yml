name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.97.0

jobs:
  linux:
    name: Linux workspace and package checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Linux libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf

      - name: Install Rust toolchain and components
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt

      - name: Check formatting
        run: cargo +$RUST_VERSION fmt --all --check

      - name: Type-check workspace
        run: cargo +$RUST_VERSION check --workspace --all-targets --locked

      - name: Run tests
        run: cargo +$RUST_VERSION test --workspace --all-targets --locked

      - name: Run Clippy
        run: cargo +$RUST_VERSION clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +$RUST_VERSION doc --workspace --no-deps --locked

      - name: Validate public crate manifests
        run: >-
          cargo +$RUST_VERSION metadata --locked --no-deps --format-version 1

      - name: Create independently publishable core archive
        run: >-
          cargo +$RUST_VERSION package --allow-dirty --locked --no-verify
          --package matrixpost-core

  desktop-compile:
    name: ${{ matrix.os }} desktop compilation
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUST_VERSION" --profile minimal

      - name: Type-check Tauri desktop shell
        shell: bash
        run: cargo +$RUST_VERSION check --package matrixpost-desktop --all-targets --locked
